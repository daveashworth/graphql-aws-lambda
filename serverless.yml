
service: graphql-aws-lambda

provider:
  name: aws
  runtime: nodejs22.x

functions:
  GraphQL:
    handler: src/handler.graphqlHandler

    events:
      - http:
          path: graphql
          method: get
      - http:
          path: graphql
          method: post

  GraphQLInspector:
    handler: src/handler.graphiqlHandler

    events:
      - http:
          path: graphiql
          method: get
